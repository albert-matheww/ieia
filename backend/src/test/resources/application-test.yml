# Test profile — datasource is supplied per-run by Testcontainers
# (see support/PostgresIntegrationTest). Only non-DB settings live here.
spring:
  jpa:
    open-in-view: false
  flyway:
    enabled: true

ieia:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret-0123456789
    access-ttl-seconds: 900
    refresh-ttl-seconds: 604800
  llm:
    provider: MOCK
  seed:
    demo: false
  reports:
    output-dir: ${java.io.tmpdir:/tmp}/ieia-test-reports
    async: false

logging:
  level:
    com.ieia: INFO
    org.testcontainers: INFO
    org.flywaydb: WARN
